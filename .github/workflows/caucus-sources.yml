name: Public caucus source records
on:
  push:
    branches: [illinois-filing-tracker]
    paths: ['.github/workflows/caucus-sources.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve official public records
        run: |
          mkdir -p source-records
          python3 - <<'PY'
          import urllib.request,ssl,pathlib,concurrent.futures,json
          context=ssl.create_default_context()
          context.load_verify_locations('sectigo-ovr40.pem')
          urls={'house':'https://www.ilga.gov/House/Members','senate':'https://www.ilga.gov/Senate/Members','files':'https://www.elections.il.gov/campaigndisclosuredatafiles/','search':'https://www.elections.il.gov/CampaignDisclosure/CommitteeSearch.aspx','sunshine':'https://www.illinoissunshine.org/'}
          def get(item):
              k,u=item
              try:
                  with urllib.request.urlopen(u,context=context,timeout=40) as r:
                      d=r.read(15000000)
                      pathlib.Path('source-records/'+k+'.html').write_bytes(d)
                      return {'name':k,'url':u,'final_url':r.url,'status':r.status,'bytes':len(d)}
              except Exception as e:return {'name':k,'url':u,'error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:
              results=list(ex.map(get,urls.items()))
          pathlib.Path('source-records/results.json').write_text(json.dumps(results,indent=2))
          print(json.dumps(results,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: caucus-source-records
          path: source-records
