name: Test classic reader
on:
  pull_request:
    paths: ['feed.mjs','web/classic/**','web/reader-panels.mjs','reader.mjs','tests/classic-browser.cjs','tests/statutes-browser.cjs','tests/chambers-browser.cjs','.github/workflows/classic-foundation.yml']
  workflow_dispatch:
    inputs:
      published:
        description: Test the published classic reader
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test reader.test.mjs
      - run: npm install --no-save --no-package-lock playwright@1.56.1 && npx playwright install --only-shell chromium
      - name: Verify phone and desktop against official indexes
        env:
          PUBLISHED: ${{ inputs.published }}
        run: |
          if [ "$PUBLISHED" = true ]; then
            export CLASSIC_ORIGIN=https://dansversion-legislative-feed.onrender.com/classic/
          else
            export ILGA_FEED_TOKEN="$(openssl rand -hex 32)"
            PORT=10009 node feed.mjs &
            feed_pid=$!
            trap 'kill "$feed_pid" 2>/dev/null || true' EXIT
            for i in {1..20}; do curl -fsS http://127.0.0.1:10009/health && break; sleep 1; done
          fi
          node tests/classic-browser.cjs
          node tests/statutes-browser.cjs
          node tests/chambers-browser.cjs
