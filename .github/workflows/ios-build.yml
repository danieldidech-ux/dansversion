name: iPhone build
on:
  push:
    branches: [illinois-filing-tracker]
    paths: ['ios/**', 'tracker/directory.json', '.github/workflows/ios-build.yml']
  workflow_dispatch:
concurrency:
  group: iphone-prototype-check
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate native directory decoding
        run: |
          curl --fail --retry 3 --max-time 30 https://illinois-filing-tracker.onrender.com/v1/directory -o /tmp/live-directory.json
          cat ios/IllinoisTracker/Models.swift ios/Checks/DirectoryCheck.swift > /tmp/DirectoryCheck.swift
          swift /tmp/DirectoryCheck.swift tracker/directory.json /tmp/live-directory.json
      - name: Build iPhone simulator app
        run: xcodebuild -project ios/IllinoisTracker.xcodeproj -scheme IllinoisTracker -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build
      - name: Launch simulator and capture live app
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/IllinoisTracker.app
          xcrun simctl launch "$DEVICE" com.danieldidech.illinoisfilings --preview-caucuses --preview-cash
          sleep 25
          xcrun simctl io "$DEVICE" screenshot IllinoisTracker-caucus-day.png
          xcrun simctl terminate "$DEVICE" com.danieldidech.illinoisfilings
          xcrun simctl launch "$DEVICE" com.danieldidech.illinoisfilings --preview-caucuses --preview-cash --preview-night
          sleep 15
          xcrun simctl io "$DEVICE" screenshot IllinoisTracker-caucus-night.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iPhone-simulator-preview
          path: IllinoisTracker-*.png
