name: iPhone build
on:
  push:
    branches: [illinois-filing-tracker]
    paths: ['ios/**', 'tracker/directory.json', '.github/workflows/ios-build.yml']
  workflow_dispatch:
concurrency:
  group: iphone-prototype-check
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Wait for matching backend release
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 15 https://illinois-filing-tracker.onrender.com/downloads/IllinoisTracker-v27.zip -o /tmp/live-release.zip && cmp -s /tmp/live-release.zip releases/Checks-and-Balances-iPhone-v27.zip; then break; fi
            sleep 10
          done
          cmp /tmp/live-release.zip releases/Checks-and-Balances-iPhone-v27.zip
      - name: Validate native directory decoding
        run: |
          curl --fail --retry 3 --max-time 30 https://illinois-filing-tracker.onrender.com/v1/directory -o /tmp/live-directory.json
          cat ios/IllinoisTracker/Models.swift ios/Checks/DirectoryCheck.swift > /tmp/DirectoryCheck.swift
          swift /tmp/DirectoryCheck.swift tracker/directory.json /tmp/live-directory.json
      - name: Validate brand assets
        run: |
          python3 - <<'PYTHON'
          import json, plistlib
          from pathlib import Path
          p = Path('ios/IllinoisTracker')
          info = plistlib.loads((p/'Info.plist').read_bytes())
          assert info['CFBundleDisplayName'] == 'Checks & Balances'
          assert info['CFBundleVersion'] == '27'
          assets = p/'Assets.xcassets'
          launch = json.loads((assets/'LaunchMark.imageset/Contents.json').read_text())
          assert launch['properties']['preserves-vector-representation'] is True
          assert launch['images'][0]['filename'] == 'LaunchMark.pdf'
          assert (assets/'AppIcon.appiconset/AppIcon.png').stat().st_size > 1000
          for catalog in assets.rglob('Contents.json'):
              data = json.loads(catalog.read_text())
              for image in data.get('images', []):
                  if 'filename' in image: assert (catalog.parent/image['filename']).is_file()
          PYTHON
      - name: Build iPhone simulator app
        run: xcodebuild -project ios/IllinoisTracker.xcodeproj -scheme IllinoisTracker -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build
      - name: Launch simulator and capture live app
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/IllinoisTracker.app
          capture() {
            LABEL="$1"
            shift
            xcrun simctl launch "$DEVICE" com.danieldidech.illinoisfilings "$@"
            sleep 12
            xcrun simctl io "$DEVICE" screenshot "IllinoisTracker-$LABEL.png"
            xcrun simctl terminate "$DEVICE" com.danieldidech.illinoisfilings
          }
          capture launch --preview-launch
          capture home-light
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iPhone-simulator-preview
          path: IllinoisTracker-*.png
