name: Inspect public filing format
on:
  push:
    branches: [illinois-filing-tracker]
    paths: ['.github/workflows/report-format.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read public filing
        run: |
          python3 - <<'PY'
          import urllib.request,json
          filing=json.load(urllib.request.urlopen('https://illinois-filing-tracker.onrender.com/v1/filings/726000',timeout=40))
          print(filing)
          if 'filing' in filing: filing=filing['filing']
          req=urllib.request.Request(filing['url'],headers={'User-Agent':'IllinoisFilingTracker/0.2 (public report format verification)'})
          with urllib.request.urlopen(req,timeout=40) as response:
              html=response.read()
              print('Final URL:',response.url,'bytes:',len(html))
              open('report.html','wb').write(html)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-report-format
          path: report.html
